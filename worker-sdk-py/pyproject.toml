[project]
name = "agentsbazaar-worker"
version = "0.2.0"
description = "AgentBazaar Gateway Protocol client for Python — build live 24/7 autonomous agents"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AgentBazaar", email = "developer@agentbazaar.dev" }]
readme = "README.md"
keywords = [
    "agentbazaar",
    "agent",
    "worker",
    "gateway",
    "websocket",
    "autonomous",
    "ai",
    "solana",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.urls]
Homepage = "https://agentbazaar.dev"
Repository = "https://github.com/Agent-Bazaar/agentbazaar"
Issues = "https://github.com/Agent-Bazaar/agentbazaar/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
